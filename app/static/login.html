<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab5 Studio</title>
<style>
  :root {
    --bg: #0B0D10; --panel: #13161A; --panel2: #1A1E23; --line: #262B31; --text: #E9E4DA; --dim: #8A8F96;
    --accent: #FFC83D; --ink: #1A1408; --bad: #FF6B6B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse 60% 50% at 50% 38%, rgba(255, 200, 61, .07), transparent 70%), var(--bg); }
  button, input { font: inherit; color: var(--text); }
  .card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 24px 22px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 22px; }
  .logo svg { width: 46px; height: 50px; }
  .logo b { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
  .logo span { color: var(--dim); font-size: 12px; margin-top: -8px; }
  label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 6px; }
  .pw { position: relative; }
  input { background: #0E1013; border: 1px solid var(--line); border-radius: 8px; padding: 9px 40px 9px 11px; width: 100%; font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  input:-webkit-autofill { -webkit-text-fill-color: var(--text); -webkit-box-shadow: 0 0 0 40px #0E1013 inset; caret-color: var(--text); transition: background-color 9999s; }
  .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: 0; padding: 6px; color: var(--dim); cursor: pointer; display: flex; }
  .eye:hover { color: var(--text); }
  svg.i { width: 16px; height: 16px; }
  .go { margin-top: 16px; width: 100%; background: var(--accent); border: 1px solid var(--accent); color: var(--ink); font-weight: 600;
    border-radius: 8px; padding: 9px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .go:hover { filter: brightness(1.06); }
  .go:disabled { opacity: .6; cursor: default; }
  .err { min-height: 18px; margin-top: 10px; color: var(--bad); font-size: 12px; text-align: center; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .lang { display: flex; justify-content: center; gap: 2px; margin: 8px auto 0; background: #0E1013; border: 1px solid var(--line);
    border-radius: 9px; padding: 2px; width: max-content; }
  .lang button { background: none; border: 0; border-radius: 7px; padding: 3px 10px; font-size: 11px; color: var(--dim); cursor: pointer; }
  .lang button.on { background: var(--accent); color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <div class="logo">
    <svg viewBox="31 34 214 235"><path fill="#FFC83D" fill-rule="evenodd" d="M244.879,93.11L244.896,93.11L244.896,209.662L244.688,209.662L244.882,209.768L138.147,268.448L31.411,209.768L31.605,209.662L31.463,209.662L31.463,93.141L31.411,93.112L138.147,34.432L244.879,93.11ZM61.145,195.764L61.145,109.459L138.147,151.792L215.214,109.423L215.214,195.598L173.919,218.353L173.919,173.791L138.147,193.458L102.44,173.827L102.44,218.485L61.145,195.764Z"/></svg>
    <b>Tab5 Studio</b>
    <span data-t="sub">Zaloguj się, żeby projektować</span>
  </div>
  <input type="text" name="username" value="tab5studio" autocomplete="username" hidden>
  <label for="pw" data-t="label">Hasło</label>
  <div class="pw">
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <button type="button" class="eye" id="eye" data-t-title="show" title="Pokaż hasło"></button>
  </div>
  <button class="go" id="go" type="submit"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg><span data-t="go">Zaloguj</span></button>
  <div class="err" id="err"></div>
  <div class="lang"><button type="button" data-ui="pl">PL</button><button type="button" data-ui="en">EN</button></div>
</form>
<script>
const T = {
  pl: {sub: "Zaloguj się, żeby projektować", label: "Hasło", go: "Zaloguj", show: "Pokaż hasło", hide: "Ukryj hasło",
       bad: "Złe hasło", many: "Za dużo prób — poczekaj chwilę", net: "Brak połączenia z serwerem"},
  en: {sub: "Sign in to start designing", label: "Password", go: "Sign in", show: "Show password", hide: "Hide password",
       bad: "Wrong password", many: "Too many attempts — wait a moment", net: "Cannot reach the server"},
};
const EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
const EYE_OFF = '<path d="M10.7 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.1M6.6 6.6A17.6 17.6 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/>';
const $ = id => document.getElementById(id);
let lang = "pl";
try { lang = localStorage.uiLang === "en" ? "en" : "pl"; } catch (e) {}  // the same setting as the editor
const t = k => T[lang][k];

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  try { localStorage.uiLang = l; } catch (e) {}
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-ui]").forEach(b => b.classList.toggle("on", b.dataset.ui === l));
  drawEye();
  if ($("err").dataset.k) $("err").textContent = t($("err").dataset.k);
}
function drawEye() {
  const shown = $("pw").type === "text";
  $("eye").innerHTML = `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${shown ? EYE_OFF : EYE}</svg>`;
  $("eye").title = t(shown ? "hide" : "show");
}
function fail(k) {
  const e = $("err"); e.dataset.k = k; e.textContent = t(k);
  $("f").classList.remove("shake"); void $("f").offsetWidth; $("f").classList.add("shake");
  $("pw").select();
}

$("eye").onclick = () => { $("pw").type = $("pw").type === "password" ? "text" : "password"; drawEye(); $("pw").focus(); };
document.querySelectorAll("[data-ui]").forEach(b => b.onclick = () => setLang(b.dataset.ui));
$("f").onsubmit = async e => {
  e.preventDefault();
  $("go").disabled = true;
  try {
    const r = await fetch("/api/login", {method: "POST", headers: {"Content-Type": "application/json"},
                                         body: JSON.stringify({password: $("pw").value})});
    if (r.ok) { location.replace("/"); return; }
    fail(r.status === 429 ? "many" : "bad");
  } catch (err) {
    fail("net");
  } finally {
    $("go").disabled = false;
  }
};
setLang(lang);
</script>
</body>
</html>
